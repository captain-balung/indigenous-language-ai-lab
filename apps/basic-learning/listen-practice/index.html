<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="聽族語音檔，選出對應的圖片或中文意思。可依身體部位、動物、地點、職業等主題練習。">
  <title>聽音練習｜族語e樂園 AI 實驗室</title>
  <link rel="stylesheet" href="/apps/basic-learning/body-parts-practice/styles.css">
  <link rel="stylesheet" href="/apps/basic-learning/listen-practice/styles.css">
</head>
<body>
  <a class="skip" href="#practice">跳至練習</a>
  <header>
    <a class="back" href="/">← 返回 AI 實驗室</a>
    <div class="hero-copy"><p>基礎學習 · MISSION 03</p><h1>聽音練習</h1><span>聽音檔，選出對應的圖片或中文意思。</span></div>
    <img src="/assets/hero/school-adventure-club.png" alt="四位學生和 AI 小夥伴一起練習族語">
  </header>

  <main id="practice">
    <section class="setup panel" aria-labelledby="setup-title">
      <div class="step">STEP 1</div><h2 id="setup-title">選擇語別、主題與作答方式</h2>
      <div class="select-grid">
        <label>語言別<select id="ethnicity"><option value="">請選擇語言別</option></select></label>
        <label>方言別<select id="dialect" disabled><option value="">請先選擇語言別</option></select></label>
      </div>
      <div id="themes" class="themes" hidden>
        <p id="theme-label">選擇練習主題</p>
        <div id="theme-grid" class="theme-grid" role="group" aria-labelledby="theme-label"></div>
      </div>
      <div id="modes" class="themes" hidden>
        <p id="mode-label">作答方式</p>
        <div id="mode-grid" class="theme-grid" role="group" aria-labelledby="mode-label">
          <button type="button" data-mode="picture" aria-pressed="false">選圖</button>
          <button type="button" data-mode="meaning" aria-pressed="false">選意思</button>
        </div>
      </div>
      <button id="start" class="primary" disabled>開始練習</button>
      <p class="alt-route">想改成寫出來或念出來？<a href="/apps/basic-learning/body-parts-practice/">看圖練習</a>或<a href="/apps/basic-learning/body-parts-speaking/">口說練習</a>用同一批主題。</p>
    </section>

    <section id="quiz" class="quiz panel" hidden aria-labelledby="question-title">
      <div class="quiz-top"><div><div class="step">STEP 2</div><p id="dialect-label"></p></div><span id="progress">本輪 1 / 10</span></div>
      <p class="prompt">聽音選答</p>
      <h2 id="question-title">這是哪一個？</h2>
      <div class="player-row">
        <button id="replay" class="primary" type="button">播放音檔</button>
        <span id="audio-state" class="audio-state" data-state="idle" aria-live="polite">尚未播放</span>
      </div>
      <audio id="player"></audio>
      <div id="choices" class="choices" role="group" aria-label="選項"></div>
      <div id="result" class="result" aria-live="polite" hidden></div>
      <div class="quiz-actions"><button id="next" hidden>下一題 →</button></div>
    </section>
  </main>

  <footer>
    <strong>教材來源與授權</strong>
    <p>看圖主題來自「族語 E 樂園」<a href="https://web.klokah.tw/extension/sp_junior/practice.php" target="_blank" rel="noopener">句型篇國中版看圖識字</a>；職業來自<a href="https://web.klokah.tw/mode/elementary/index.php" target="_blank" rel="noopener">教學模組初級</a>。由財團法人原住民族語言研究發展基金會製作，以 <a href="https://web.klokah.tw/creativeCommons/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> 釋出。本練習不得作商業用途。</p>
  </footer>
  <script type="module" src="/apps/basic-learning/listen-practice/app.mjs"></script>
</body>
</html>
