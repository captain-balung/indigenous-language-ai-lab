<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="看中文意思，自己寫族語。每題都翻譯，並顯示系統懂成。">
  <title>意思造句｜族語e樂園 AI 實驗室</title>
  <link rel="stylesheet" href="/apps/basic-learning/body-parts-practice/styles.css">
  <link rel="stylesheet" href="/apps/basic-learning/body-parts-speaking/styles.css">
  <link rel="stylesheet" href="/apps/classroom-quiz/meaning-sentence/styles.css">
</head>
<body>
  <a class="skip" href="#practice">跳至測驗</a>
  <header>
    <a class="back" href="/">← 返回 AI 實驗室</a>
    <div class="hero-copy"><p id="mission">課堂測驗 · MISSION 01</p><h1 id="page-title">意思造句</h1><span id="page-lead">只看中文意思，自己寫族語。每題都翻譯，並顯示系統懂成。</span></div>
    <img src="/assets/hero/school-adventure-club.png" alt="四位學生和 AI 小夥伴一起練習族語">
  </header>

  <main id="practice">
    <section class="setup panel" aria-labelledby="setup-title">
      <div class="step">STEP 1</div><h2 id="setup-title">選擇語別</h2>
      <div class="select-grid">
        <label>語言別<select id="ethnicity"><option value="">請選擇語言別</option></select></label>
        <label>方言別<select id="dialect" disabled><option value="">請先選擇語言別</option></select></label>
      </div>
      <div id="api-status" class="api-status" aria-live="polite">正在確認服務…</div>
      <button id="start" class="primary" type="button" disabled>開始本堂</button>
    </section>

    <section id="quiz" class="quiz panel" hidden aria-labelledby="question-title">
      <div class="quiz-top"><div><div class="step">STEP 2</div><p id="dialect-label"></p></div><span id="progress">第 1 / 8 題</span></div>
      <p id="prompt" class="prompt">造句</p>
      <h2 id="question-title">看中文，寫出族語</h2>
      <div id="panel-compose">
        <p id="compose-meaning" class="meaning"></p>
        <label for="answer">用族語寫出這個意思，不必逐字相同</label>
        <input id="answer" autocomplete="off" spellcheck="false">
      </div>
      <div class="submit-row">
        <button id="submit" class="primary" type="button" disabled>送出答案</button>
      </div>
      <div id="result" class="result" aria-live="polite" hidden></div>
      <div class="quiz-actions"><button id="next" type="button" hidden>下一題 →</button></div>
    </section>

    <section id="report" class="panel" hidden aria-labelledby="report-title">
      <div class="step">STEP 3</div>
      <h2 id="report-title">本堂分數</h2>
      <p id="score-line" class="score-line"></p>
      <ol id="score-list" class="score-list"></ol>
      <button id="again" class="primary" type="button">再測一輪</button>
    </section>
  </main>

  <footer>
    <strong>教材來源與授權</strong>
    <p>題目來自「族語 E 樂園」<a href="https://web.klokah.tw/extension/sp_junior/practice.php" target="_blank" rel="noopener">句型篇國中版</a>，由財團法人原住民族語言研究發展基金會製作，以 <a href="https://web.klokah.tw/creativeCommons/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> 釋出。本測驗不得作商業用途。分數只留在這一輪畫面，不是認證成績。</p>
  </footer>
  <script type="module" src="/apps/classroom-quiz/meaning-sentence/app.mjs"></script>
</body>
</html>
