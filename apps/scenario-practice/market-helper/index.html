<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="到市場攤位問價、比較、購買與結帳。用族語說出香蕉、橘子、地瓜等貨品名，練習購物與數量。">
  <title>市場小幫手｜族語e樂園 AI 實驗室</title>
  <link rel="stylesheet" href="/apps/basic-learning/body-parts-practice/styles.css">
  <link rel="stylesheet" href="/apps/basic-learning/body-parts-speaking/styles.css">
  <link rel="stylesheet" href="/apps/scenario-practice/market-helper/styles.css">
</head>
<body>
  <a class="skip" href="#practice">跳至練習</a>
  <header>
    <a class="back" href="/">← 返回 AI 實驗室</a>
    <div class="hero-copy"><p>情境應用 · MISSION 02</p><h1>市場小幫手</h1><span>100 元預算——依媽媽的清單問價、把菜或水果買齊。</span></div>
    <img src="/assets/hero/school-adventure-club.png" alt="四位學生和 AI 小夥伴一起練習族語">
  </header>

  <main id="practice">
    <section id="setup" class="setup panel" aria-labelledby="setup-title">
      <div class="step">STEP 1</div><h2 id="setup-title">選語言別，再開始買菜</h2>
      <div class="select-grid">
        <label>語言別<select id="ethnicity"><option value="">請選擇語言別</option></select></label>
        <label>方言別<select id="dialect" disabled><option value="">請先選擇語言別</option></select></label>
      </div>

      <p id="model-note" class="model-note" aria-live="polite"></p>
      <div id="api-status" class="api-status" aria-live="polite">正在確認翻譯與語音辨識服務…</div>
      <button id="start" class="primary" disabled>開始任務</button>
      <p class="alt-route">想先練生活對話？<a href="/apps/scenario-practice/village-life/">部落大小事</a>；想練單句問答？<a href="/apps/basic-learning/qa-practice/">問答練習</a>。</p>
    </section>

    <section id="scene" class="scene panel" hidden aria-labelledby="mission-title">
      <div class="quiz-top">
        <div><div class="step">STEP 2</div><p id="dialect-label"></p></div>
        <span id="phase-label" class="phase-pill">問價</span>
      </div>

      <div class="scene-nav">
        <button id="back-setup" type="button">← 回到設定</button>
        <div id="budget-line" class="budget-meter" aria-live="polite">
          <span class="budget-meter__label">預算</span>
          <span class="budget-meter__track"><span id="budget-fill" class="budget-meter__fill" style="width:0%"></span></span>
          <span id="budget-text" class="budget-meter__text">0 / 100 元</span>
        </div>
      </div>

      <details class="brief" open>
        <summary>任務說明</summary>
        <h2 id="mission-title" class="visually-hidden">市場攤位</h2>
        <p id="scenario-text"></p>
        <p id="mission-text"></p>
        <p id="hint-text" class="hint-text"></p>
      </details>

      <div class="stall-layout">
        <div class="stall-stage">
          <div class="awning" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <div class="stall-stage__body">
            <p class="stall-kicker">今日貨架</p>
            <div id="product-grid" class="product-grid" role="list"></div>

            <div class="vendor-board" aria-live="polite">
              <span class="vendor-board__who">攤主</span>
              <p id="vendor-say" class="vendor-board__say">點一種貨，用族語說出它的名字來問價。</p>
            </div>

            <div class="stall-actions">
              <button id="ask-detail" type="button" hidden>一斤大約幾個？</button>
              <button id="bargain" type="button" hidden>能便宜一點嗎？</button>
              <button id="to-buy" type="button" class="primary" hidden>去購買 →</button>
              <button id="to-ask" type="button" hidden>← 再問價</button>
            </div>
          </div>
        </div>

        <div class="scene-side">
          <div id="speak-panel" class="my-turn">
            <p class="prompt" id="speak-prompt">換你說</p>
            <h2 id="turn-title">用族語說貨品名</h2>
            <p id="turn-hint" class="turn-hint">先在左邊點選一種貨。</p>
            <div class="player-row">
              <button id="replay" class="primary" type="button" disabled>聽教材發音</button>
              <span id="audio-state" class="audio-state" data-state="idle" aria-live="polite">選貨後可聽</span>
            </div>
            <audio id="player"></audio>

            <div id="qty-row" class="qty-row" hidden>
              <span class="qty-row__label" id="qty-label">要買幾顆／條？</span>
              <div class="qty-stepper" role="group" aria-labelledby="qty-label">
                <button id="qty-dec" type="button" aria-label="減少">−</button>
                <input id="qty" type="number" min="1" max="20" value="1" inputmode="numeric">
                <button id="qty-inc" type="button" aria-label="增加">+</button>
              </div>
            </div>

            <label for="answer">族語（打字）</label>
            <textarea id="answer" autocomplete="off" spellcheck="false" rows="2"></textarea>

            <div class="recorder">
              <button id="record" class="primary record-button" type="button">
                <span class="record-dot" aria-hidden="true"></span><span id="record-label">開始錄音</span>
              </button>
              <output id="record-time" aria-live="off">00:00</output>
            </div>
            <div id="record-state" class="record-state" data-state="idle" aria-live="polite">
              <span class="record-state__icon" aria-hidden="true">●</span><span id="record-state-text">尚未錄音，打字也可以送出</span>
            </div>
            <p id="record-note" class="record-note" aria-live="polite"></p>
            <audio id="preview" controls hidden></audio>

            <div class="action-row">
              <button id="submit" class="primary" type="button" disabled>送出</button>
              <button id="rerecord" type="button" hidden>重錄</button>
              <button id="retry" type="button" hidden>再試一次</button>
            </div>
            <p id="heard" class="heard" hidden></p>
            <div id="result" class="result" hidden></div>
          </div>

          <div id="cart-panel" class="cart-panel" hidden>
            <h3>購物籃</h3>
            <ul id="cart-list" class="cart-list"></ul>
            <div class="cart-footer">
              <p id="cart-total" class="cart-total">合計 0 元</p>
              <button id="checkout" class="primary" type="button" disabled>結帳</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="report" class="report panel" hidden aria-labelledby="report-title">
      <div class="step">結果</div>
      <h2 id="report-title">結帳結果</h2>
      <p id="report-headline" class="report-headline"></p>
      <p id="report-detail"></p>
      <p id="report-math" class="report-math"></p>
      <div class="action-row">
        <button id="again" class="primary" type="button">再玩一次</button>
        <button id="back-setup-report" type="button">← 回到設定</button>
      </div>
    </section>
  </main>

  <script type="module" src="/apps/scenario-practice/market-helper/app.mjs"></script>
</body>
</html>
