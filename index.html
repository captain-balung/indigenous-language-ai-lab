<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="族語e樂園 AI 實驗室：探索族語學習的 AI 應用入口。">
  <meta name="theme-color" content="#fff7df">
  <title>族語e樂園 AI 實驗室</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#applications">跳至應用列表</a>
  <div class="sky-decor sky-decor--one" aria-hidden="true"></div>
  <div class="sky-decor sky-decor--two" aria-hidden="true"></div>

  <header class="hero">
    <nav class="topbar" aria-label="主要導覽">
      <a class="brand" href="#top" aria-label="族語e樂園 AI 實驗室首頁">
        <span class="brand__mark" aria-hidden="true">AI</span>
        <span>族語e樂園 <strong>AI 實驗室</strong></span>
      </a>
      <a class="topbar__cta" href="#applications">開始探索 <span aria-hidden="true">↓</span></a>
    </nav>

    <div class="hero__content" id="top">
      <div class="hero__copy">
        <p class="eyebrow"><span aria-hidden="true">✦</span> 歡迎來到族語學習冒險基地</p>
        <h1>用 AI，開啟<br><span>族語新玩法！</span></h1>
        <p class="hero__lead">從基礎學習到情境互動，所有族語 AI 工具都在這裡。選一項任務，開始你的探索旅程吧！</p>
        <div class="hero__actions">
          <a class="button button--primary" href="#applications">探索 20 項任務 <span aria-hidden="true">→</span></a>
          <span class="hero__note"><span aria-hidden="true">●</span> 實驗室持續擴充中</span>
        </div>
      </div>

      <div class="hero__scene" aria-hidden="true">
        <div class="orbit orbit--one"></div>
        <div class="orbit orbit--two"></div>
        <div class="mascot">
          <div class="mascot__antenna"><i></i></div>
          <div class="mascot__ear mascot__ear--left"></div>
          <div class="mascot__ear mascot__ear--right"></div>
          <div class="mascot__head">
            <span class="mascot__eye mascot__eye--left"></span>
            <span class="mascot__eye mascot__eye--right"></span>
            <span class="mascot__smile"></span>
          </div>
          <div class="mascot__body"><span>AI</span></div>
          <div class="mascot__arm mascot__arm--left"></div>
          <div class="mascot__arm mascot__arm--right"></div>
        </div>
        <div class="float-card float-card--mic"><img src="assets/icons/listening-ear.webp" alt=""><small>聽見族語</small></div>
        <div class="float-card float-card--chat"><img src="assets/icons/speaking-microphone.webp" alt=""><small>一起練習</small></div>
        <div class="float-card float-card--spark"><img src="assets/icons/bronze-medal.webp" alt=""><small>學習升級</small></div>
      </div>
    </div>

    <div class="category-nav-wrap">
      <p>快速前往</p>
      <div class="category-nav" id="category-nav" aria-label="應用分類"></div>
    </div>
  </header>

  <main id="applications" tabindex="-1">
    <section class="intro" aria-labelledby="applications-title">
      <p class="section-kicker">CHOOSE YOUR MISSION</p>
      <h2 id="applications-title">今天想挑戰什麼？</h2>
      <p>五大學習領域、二十項 AI 任務，依照你的步調自由探索。</p>
    </section>
    <div id="category-sections"></div>
  </main>

  <footer>
    <a class="brand brand--footer" href="#top">
      <span class="brand__mark" aria-hidden="true">AI</span>
      <span>族語e樂園 <strong>AI 實驗室</strong></span>
    </a>
    <p>讓科技陪伴每一次族語學習。更多實驗任務即將登場！</p>
    <a href="#top">回到頂端 ↑</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
